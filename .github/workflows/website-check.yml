name: Website integrity checks
on:
  push:
    branches: [website-upgrade-2026, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate website files
        run: node tests/check-site.mjs
